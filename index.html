<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-Q1l4BjwdWqEH/BT9w+KTzKlJmjRnbQ/6dEfYnQqRe+4='; style-src 'unsafe-inline'; connect-src 'none'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>인사 발령 유인물</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#d9dce1; --text:#1d2129; --muted:#6b7280;
  --accent:#2f5bb7; --accent-soft:#e8eefb; --danger:#c0392b; --ok:#1e7d4f; --warn:#b26a00;
  --blue:#dfe6f7; --yellow:#fff7cc;
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px}
button:hover{background:#f0f2f5}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#264c9c}
button.danger{color:var(--danger);border-color:#e7b9b3}
button.icon{padding:4px 8px;line-height:1}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=password],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #9db5ea;outline-offset:-1px}

#app{display:grid;grid-template-rows:52px 1fr;height:100vh}
header.top{display:flex;align-items:center;gap:8px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line)}
header.top h1{font-size:16px;margin:0 10px 0 0;white-space:nowrap}
header.top .spacer{flex:1}
.status{font-size:12px;padding:4px 10px;border-radius:999px;background:#eef0f3;color:var(--muted);white-space:nowrap}
.status.saved{background:#e3f4ea;color:var(--ok)}
.status.saving,.status.dirty{background:#fff4e0;color:var(--warn)}
.status.error{background:#fbe7e5;color:var(--danger)}
.gear{font-size:18px;padding:4px 10px}

.body{display:grid;grid-template-columns:250px 1fr;min-height:0}
aside.side{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 8px 30px}
.side h2{font-size:12px;color:var(--muted);margin:14px 8px 6px;display:flex;justify-content:space-between}
.side ul{list-style:none;margin:0;padding:0}
.side li button{width:100%;text-align:left;border:0;border-radius:6px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;background:transparent}
.side li button:hover{background:#f2f4f7}
.side li button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.badge{font-size:11px;min-width:22px;text-align:center;border-radius:999px;background:#eef0f3;color:var(--muted);padding:1px 6px}
.badge.over{background:#fff0d6;color:var(--warn)}

main.main{overflow:auto;padding:18px 22px 60px}
.school-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.school-head h2{margin:0;font-size:20px}
.school-head .lv{color:var(--muted)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px;align-items:center}
.toolbar .note{color:var(--muted);font-size:12px}
.notice{background:#fff8e6;border:1px solid #f1d9a6;color:#7a5200;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:10px}

table.ed{border-collapse:collapse;background:#fff;width:100%;min-width:1000px;table-layout:fixed}
table.ed th,table.ed td{border:1px solid #c9cdd4;padding:0;height:30px}
table.ed thead th{background:var(--blue);font-weight:600;font-size:13px;padding:4px;position:sticky;top:0;z-index:1}
table.ed th.grp{border-bottom:1px solid #9aa4b5}
table.ed td.no{background:var(--blue);text-align:center;width:42px;font-size:13px}
table.ed td.req{background:var(--yellow)}
table.ed td.sep, table.ed th.sep{border-left:2px solid #333}
table.ed td input,table.ed td select{width:100%;border:0;border-radius:0;background:transparent;padding:4px 6px;height:30px;text-align:center}
table.ed td input:focus,table.ed td select:focus{background:#fff;outline:2px solid #9db5ea}
table.ed td input.auto{background:#e6f4ea}
table.ed td.del{width:34px;text-align:center;border:0;background:transparent}
table.ed td.del button{border:0;background:transparent;color:#999;padding:2px 6px}
table.ed td.del button:hover{color:var(--danger)}
.empty-row td{color:var(--muted);text-align:center;font-size:13px;height:44px}

.stats{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:74px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:12px;color:var(--muted)}
.notes{margin-top:14px}
.notes label{font-weight:700;display:block;margin-bottom:4px}
.note-lines{display:flex;flex-direction:column;gap:4px}
.note-line{display:flex;gap:4px;align-items:center}
.note-line .mark{width:18px;text-align:center;color:#555}
.note-line input{flex:1}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(20,24,33,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:16px}
.settings{width:min(1100px,96vw);height:88vh}
.settings .wrap{display:grid;grid-template-columns:180px 1fr;min-height:0;flex:1}
.settings nav{border-right:1px solid var(--line);padding:8px;overflow:auto;background:#fafbfc}
.settings nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px}
.settings nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.settings .pane{padding:16px 20px;overflow:auto}
.pane h4{margin:0 0 6px;font-size:15px}
.pane p.help{color:var(--muted);margin:0 0 12px;font-size:13px;line-height:1.55}
.list-ed{display:flex;flex-direction:column;gap:4px;max-width:520px}
.list-ed .it{display:flex;gap:4px;align-items:center}
.list-ed .it input{flex:1}
.list-ed .it .idx{width:26px;color:var(--muted);font-size:12px;text-align:right}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
table.sch{border-collapse:collapse;width:100%;max-width:820px}
table.sch th,table.sch td{border-bottom:1px solid #eceef1;padding:4px;text-align:left}
table.sch th{font-size:12px;color:var(--muted);font-weight:600}
.form{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;max-width:640px;align-items:center}
.form label{font-size:13px;color:#374151}
.form input{width:100%}
.row-btns{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0;background:#fafbfc;font-size:13px;line-height:1.6}
.box ol{margin:4px 0 0;padding-left:20px}
.imp-table{border-collapse:collapse;margin-top:10px;font-size:13px}
.imp-table th,.imp-table td{border:1px solid #e3e5e9;padding:4px 8px}
.sum-table th{background:var(--blue);font-size:12px}
.sum-table td{text-align:center}
.small{font-size:12px;color:var(--muted)}
.unlock{width:min(460px,94vw)}
.unlock .content{padding:16px}
.preview{width:min(900px,96vw);height:92vh}
.preview .pv{flex:1;overflow:auto;background:#7c8088;padding:20px;display:flex;flex-direction:column;align-items:center;gap:20px}
.preview .page{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:.95}

/* ===== 출력용 유인물 ===== */
.page{width:190mm;height:267mm;overflow:hidden;position:relative}
.sheet{width:190mm;transform-origin:top left}
table.ho{border-collapse:collapse;table-layout:fixed;width:190mm;font-family:"Malgun Gothic","맑은 고딕",sans-serif;font-size:10pt;color:#000}
table.ho td{border:0.6pt solid #000;padding:0 1.5pt;text-align:center;vertical-align:middle;white-space:nowrap;overflow:hidden;line-height:1.1}
table.ho td.nb{border:none}
table.ho td.bl{background:var(--blue)}
table.ho td.ye{background:var(--yellow)}
table.ho td.tl{border-left:1.6pt solid #000}
table.ho td.tr{border-right:1.6pt solid #000}
table.ho td.tt{border-top:1.6pt solid #000}
table.ho td.tb{border-bottom:1.6pt solid #000}
table.ho td.title{font-size:17pt;font-weight:700;letter-spacing:0;white-space:pre}
table.ho td.wa{white-space:normal;word-break:break-all;line-height:1.25}
table.ho td.sname{font-size:12pt;font-weight:700;text-align:left;padding-left:3pt}
table.ho td.org{font-size:12pt;font-weight:700;text-align:right}
table.ho td.wrap{white-space:normal;word-break:keep-all}
table.ho td.notes{white-space:normal;text-align:left;vertical-align:middle;padding:2pt 4pt;word-break:keep-all}
table.ho td.notes .nl{padding-left:1.1em;text-indent:-1.1em;line-height:1.35}
#printArea{position:absolute;left:-100000px;top:0;visibility:hidden}

@page{size:A4 portrait;margin:15mm 10mm}
@media print{
  html,body{background:#fff;height:auto}
  #app,.overlay,.toast{display:none!important}
  #printArea{position:static;visibility:visible}
  #printArea .page{page-break-after:always;break-after:page}
  #printArea .page:last-child{page-break-after:auto;break-after:auto}
  table.ho td.bl,table.ho td.ye{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea" aria-hidden="true"></div>
<datalist id="dl-schools"></datalist>
<datalist id="dl-notes"></datalist>
<script>
'use strict';
/* =========================================================
   인사 발령 유인물 웹앱
   - 자료는 이 기기(브라우저)에만 저장, 외부 서버로 전송하지 않음(connect-src 'none')
   - 다른 기기와는 백업 파일(.json, 선택 암호화) 또는 엑셀 파일로 주고받음
   ========================================================= */

/* ---------- 기본값 ---------- */
const DEFAULT_TYPES = ['청간','관내','기간제','TO증','TO감','학교정원','신규','정년퇴직','명예퇴직','진로전담 선발','전문직','승진','타시도전출','타시도전입','휴직.면직','복직','파견','파견복귀','미발령'];
const DEFAULT_SUBJECTS = ['국어','수학','영어','도덕윤리','일반사회','역사','지리','통합사회','물리','화학','생물','지구과학','통합과학','기술','가정','정보컴퓨터','체육','음악','미술','한문','일본어','중국어','러시아어','스페인어','진로진학상담','전문상담','보건','영양','사서','기계금속','전기전자통신','화공','화공섬유','미용','의상'];
const DEFAULT_NOTES = ['정원외 기간제','미배치 기간제','초빙','관내동시내신'];
const DEFAULT_SCHOOLS = [
 ['mid','군서미래국제학교','군서미래국제'],['mid','군자중학교','군자중'],['mid','논곡중학교','논곡중'],['mid','대흥중학교','대흥중'],
 ['mid','산현중학교','산현중'],['mid','배곧중학교','배곧중'],['mid','배곧라라중학교','배곧라라중'],['mid','배곧해솔중학교','배곧해솔중'],
 ['mid','서해중학교','서해중'],['mid','소래중학교','소래중'],['mid','송운중학교','송운중'],['mid','시화나래중학교','시화나래중'],
 ['mid','시화중학교','시화중'],['mid','시흥가온중학교','시흥가온중'],['mid','시흥능곡중학교','시흥능곡중'],['mid','시흥매화중학교','시흥매화중'],
 ['mid','시흥은행중학교','시흥은행중'],['mid','시흥중학교','시흥중'],['mid','신천중학교','신천중'],['mid','연성중학교','연성중'],
 ['mid','월곶중학교','월곶중'],['mid','은계중학교','은계중'],['mid','응곡중학교','응곡중'],['mid','장곡중학교','장곡중'],
 ['mid','정왕중학교','정왕중'],['mid','조남중학교','조남중'],['mid','함현중학교','함현중'],
 ['high','경기스마트고등학교','경스고'],['high','군서고등학교','군서고'],['high','군자디지털과학고등학교','군디과고'],['high','목감고등학교','목감고'],
 ['high','배곧고등학교','배곧고'],['high','서해고등학교','서해고'],['high','소래고등학교','소래고'],['high','시흥고등학교','시흥고'],
 ['high','시흥능곡고등학교','시흥능곡고'],['high','시흥매화고등학교','시흥매화고'],['high','신천고등학교','신천고'],['high','은행고등학교','은행고'],
 ['high','장곡고등학교','장곡고'],['high','정왕고등학교','정왕고'],['high','함현고등학교','함현고'],
 ['office','경기도시흥교육지원청','교육청']
];
const DEFAULT_ALIASES = [['상담','전문상담']];
const LEVELS = [['mid','중학교'],['high','고등학교'],['office','교육청']];
const DEFAULT_LABELS = {
  title:'[  인     사     발     령     유     인     물  ]', org:'경기도시흥교육지원청', schoolLabel:'학교명',
  no:'연번', reqGroup:'소요사항', resGroup:'발령사항',
  reqSubject:'교과', reqType:'구분', reqName:'성명', reqTo:'발령교',
  resType:'구분', resName:'성명', resFrom:'전임교', resNote:'비고',
  stats:'통계자료', notes:'특이사항'
};
const LABEL_NAMES = {
  title:'제목', org:'기관명(우측 상단)', schoolLabel:'학교명 머리글', no:'연번', reqGroup:'소요사항(묶음 제목)', resGroup:'발령사항(묶음 제목)',
  reqSubject:'소요 - 교과', reqType:'소요 - 구분', reqName:'소요 - 성명', reqTo:'소요 - 발령교',
  resType:'발령 - 구분', resName:'발령 - 성명', resFrom:'발령 - 전임교', resNote:'발령 - 비고', stats:'통계자료', notes:'특이사항'
};
const BASE_ROWS = 35;

function defaultSummary(){
  return {
    title:'2026.3.1.자 중등교사 인사 현황', nameMode:'name', outLabel:'교사 전출', inLabel:'교사 전입', totalLabel:'계', balanceLabel:'결충원', excludeSubjects:['영양','사서'],
    out:[
      {label:'관내', req:['관내'], exclRes:['미발령']},
      {label:'청간', req:['청간'], exclRes:['미발령']},
      {label:'타시도 전출', req:['타시도전출'], exclRes:[]},
      {label:'승진,전문직,\n명퇴,휴직,진로전담,\n파견', req:['승진','전문직','명예퇴직','휴직.면직','진로전담 선발','파견'], exclRes:[]},
      {label:'결충원\n(증원+정원외)', req:['TO증','기간제','학교정원','정년퇴직'], exclRes:[], minusRes:['TO감']}
    ],
    in:[
      {label:'관내', res:['관내']},
      {label:'청간', res:['청간']},
      {label:'타시도', res:['타시도전입']},
      {label:'복직,복귀', res:['복직','파견복귀']},
      {label:'신규', res:['신규'], exclNote:'수석'},
      {label:'정원외', res:['기간제']},
      {label:'수석신규', res:['신규'], note:'수석'}
    ]
  };
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()).replace(/-/g,'').slice(0,16); }
function defaultState(){
  return {
    format:'hr-handout-state', v:1,
    labels:{...DEFAULT_LABELS},
    schools: DEFAULT_SCHOOLS.map(([level,name,short])=>({id:uid(),level,name,short})),
    subjects:[...DEFAULT_SUBJECTS],
    reqTypes:[...DEFAULT_TYPES],
    resTypes:[...DEFAULT_TYPES],
    noteOptions:[...DEFAULT_NOTES],
    subjectAliases: DEFAULT_ALIASES.map(([from,to])=>({from,to})),
    rosterRecs:[], pdfRecs:[], pdfInfo:null,
    summary: defaultSummary(),
    stats:{ single:['관내','청간','파견복귀','타시도전입','복직','신규'], unassigned:'미발령', unassignedBy:['관내','청간'],
            tempLabel:'기간제', temp:[{label:'정원외',match:'정원외 기간제'},{label:'미배치',match:'미배치 기간제'}] },
    data:{}, updatedAt:null
  };
}
function normalizeState(s){
  const d = defaultState();
  if(!s || typeof s!=='object') return d;
  const out = {...d, ...s};
  out.labels = {...d.labels, ...(s.labels||{})};
  out.stats = {...d.stats, ...(s.stats||{})};
  for(const k of ['subjects','reqTypes','resTypes','noteOptions']) if(!Array.isArray(out[k])) out[k]=d[k];
  if(!Array.isArray(out.subjectAliases)) out.subjectAliases = d.subjectAliases;
  if(!out.summary || !Array.isArray(out.summary.out)) out.summary=defaultSummary();
  if(!Array.isArray(out.rosterRecs)) out.rosterRecs=[];
  if(!Array.isArray(out.pdfRecs)) out.pdfRecs=[];
  if(!Array.isArray(out.schools) || !out.schools.length) out.schools = d.schools;
  if(!out.data || typeof out.data!=='object') out.data = {};
  return out;
}

/* ---------- 상태 ---------- */
let S = defaultState();
let currentId = S.schools[0].id;
let saveTimer=null, lastSavedAt=null, storageOk=true;

const coll = new Intl.Collator('ko');
const $ = (sel, el=document)=>el.querySelector(sel);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k==='style') el.style.cssText=v;
    else if(k==='value') el.value=v;
    else if(k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else if(typeof v==='boolean') el[k]=v;
    else el.setAttribute(k, v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null || kid===false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }

}
function makeSelect(options, value, onchange, cls){
  const sel = h('select', {class:cls});
  sel.append(h('option',{value:''},''));
  const opts=[...options];
  if(value && !opts.includes(value)) opts.push(value);
  for(const o of opts) sel.append(h('option',{value:o},o));
  sel.value = value||'';
  if(onchange) sel.addEventListener('change', ()=>onchange(sel.value));
  return sel;
}

/* ---------- 정렬 / 통계 ---------- */
function idxMap(arr){ const m=new Map(); arr.forEach((v,i)=>{ if(!m.has(v)) m.set(v,i); }); return m; }
function cmpByList(m, a, b){
  a=a||''; b=b||'';
  const ia = a ? (m.has(a)? m.get(a) : 1e5) : 1e6;
  const ib = b ? (m.has(b)? m.get(b) : 1e5) : 1e6;
  if(ia!==ib) return ia-ib;
  return ia===1e5 ? coll.compare(a,b) : 0;
}
function sortRows(rows){
  const sm=idxMap(S.subjects), tm=idxMap(S.reqTypes);
  return rows.slice().sort((x,y)=> cmpByList(sm,x.subject,y.subject) || cmpByList(tm,x.reqType,y.reqType) || coll.compare(x.reqName||'', y.reqName||''));
}
function computeStats(rows){
  const st=S.stats;
  return {
    single: st.single.slice(0,6).map(t=>({label:t||'', n:t?rows.filter(r=>clean(r.resType)===t).length:0})),
    unassigned: st.unassignedBy.map(t=>({label:t, n:rows.filter(r=>clean(r.reqType)===t && clean(r.resType)===st.unassigned).length})),
    temp: st.temp.map(x=>({label:x.label, n:rows.filter(r=>clean(r.note)===x.match).length}))
  };
}

const COLW=[5.125,10,8.625,8.75,13.875,8.625,9.0039,7.25,7.25,7.25,7.25];
const PT_PER_MM = 72/25.4;
const PAGE_H_PT = 267*PT_PER_MM;
const H = {title:24.9, gap:8.25, school:22.05, head:16.75, row:16.4, stat1:16.75, stat2:16.4, stat3:21, note:16.4};
function buildPage(school){

  const n=Math.max(BASE_ROWS, rows.length);

  const rowH=Math.min(H.row, (PAGE_H_PT-fixed-2)/n);

  const tot=COLW.reduce((a,b)=>a+b,0);
  const tb=h('table',{class:'ho'}, h('colgroup',null, COLW.map(w=>h('col',{style:`width:${(w/tot*100).toFixed(3)}%`}))));
  const tr=(ht,...cells)=>h('tr',{style:`height:${ht}pt`},...cells);
  const td=(cls,text,attrs={})=>h('td',{class:cls,text:text??'',...attrs});
  tb.append(
    tr(H.title, td('nb'), td('nb title',L.title,{colspan:9}), td('nb')),

    tr(H.school, td('nb sname',L.schoolLabel,{colspan:2}), td('nb sname',school.name,{colspan:3}), td('nb'), td('nb org',L.org,{colspan:5})),
    tr(H.head, td('bl tt tl',L.no,{rowspan:2}), td('bl tt',L.reqGroup,{colspan:4}), td('bl tt tl tr',L.resGroup,{colspan:6})),
    tr(H.head, td('bl tb',L.reqSubject), td('bl tb',L.reqType), td('bl tb',L.reqName), td('bl tb',L.reqTo),
       td('bl tb tl',L.resType), td('bl tb',L.resName), td('bl tb',L.resFrom,{colspan:2}), td('bl tb tr',L.resNote,{colspan:2}))
  );
  for(let i=0;i<n;i++){
    const r=rows[i]||{};
    const c = (cls,v,a)=>{ const e=td(cls+' fit',clean(v),a); e.style.fontSize=fs+'pt'; return e; };
    tb.append(tr(rowH, c('bl tl',i+1), c('ye',r.subject), c('ye',r.reqType), c('ye',r.reqName), c('ye',r.reqTo),
       c('tl',r.resType), c('',r.resName), c('',r.resFrom,{colspan:2}), c('tr',r.note,{colspan:2})));
  }

  r1.append(td('bl tt',S2.unassigned,{colspan:2}), td('bl tt tr',S2.tempLabel,{colspan:2}));
  const r2=tr(H.stat2, td('bl',st.unassigned[0]?.label), td('bl',st.unassigned[1]?.label), td('bl',st.temp[0]?.label), td('bl tr',st.temp[1]?.label));
  const r3=tr(H.stat3);

  tb.append(r1,r2,r3,

  const sheet=h('div',{class:'sheet'},tb);
  return h('div',{class:'page'},sheet);

function notesCell(text){
  const c=h('td',{class:'tt tr tb notes',colspan:10,rowspan:3});

function fitPages(container){
  // 1) 칸 너비를 넘는 글자는 글자 크기를 줄여 맞춤
  const cells=[...container.querySelectorAll('td.fit, td.sname, td.org')];
  const over=cells.filter(c=>c.scrollWidth>c.clientWidth+0.5);
  for(const c of over){
    let fs=parseFloat(getComputedStyle(c).fontSize)*0.75; // px→pt
    let guard=0;
    while(c.scrollWidth>c.clientWidth+0.5 && fs>5 && guard++<30){ fs-=0.4; c.style.fontSize=fs+'pt'; }
  }
  // 2) 특이사항 등으로 한 장을 넘으면 전체를 축소
  for(const p of container.querySelectorAll('.page')){
    const sh=p.querySelector('.sheet'); sh.style.zoom='';
    const ratio=p.clientHeight/sh.scrollHeight;
    if(ratio<1) sh.style.zoom=String(Math.floor(ratio*1000)/1000);
  }
}

/* ---------- 관내·청간 명부 → 소요사항 ---------- */
const normName=v=>clean(v).replace(/\s+/g,'');
function mapSubject(raw){
  let v=clean(raw).replace(/[・·∙•ㆍ‧･]/g,'').replace(/\s+/g,'');
  if(!v) return '';
  const al=S.subjectAliases.find(a=>normName(a.from)===v); if(al) return clean(al.to);
  const hit=S.subjects.find(x=>normName(x)===v); return hit||v;
}
function findSchool(raw){
  const v=normName(raw); if(!v) return null;
  return S.schools.find(s=>normName(s.name)===v) || S.schools.find(s=>normName(s.short)===v)
      || (/교육지원청$|교육청$/.test(v) ? S.schools.find(s=>s.level==='office' && (v.endsWith(normName(s.name).replace(/^경기도/,'')) || normName(s.name).endsWith(v.replace(/^경기도/,'')))) : null);
}
async function parseRoster(buf){
  const sheets=await readWorkbook(buf);
  for(const sh of sheets){
    if(sh.hidden) continue;
    const byRow=new Map(); let maxRow=0;
    for(const [ref,val] of sh.cells){ const m=/^([A-Z]+)(\d+)$/.exec(ref); if(!m) continue; const r=+m[2]; maxRow=Math.max(maxRow,r); if(!byRow.has(r)) byRow.set(r,{}); byRow.get(r)[m[1]]=val; }
    let hr=0, col={};
    for(let r=1;r<=Math.min(maxRow,20);r++){
      const row=byRow.get(r)||{}; const inv={};
      for(const [c,v] of Object.entries(row)) inv[normName(v)] = inv[normName(v)] || c;
      const inst=inv['기관']||inv['소속교']||inv['학교명']||inv['소속기관'];
      if(inst && inv['교과']){ hr=r; col={inst:inv['기관']||inv['소속교']||inv['학교명']||inv['소속기관'], subject:inv['교과'], name:inv['성명'], hope:inv['1희망지']||inv['희망지']}; break; }
    }
    if(!hr) continue;
    const recs=[]; let hopeOffice=0, hopeSchool=0;
    for(let r=hr+1;r<=maxRow;r++){
      const x=byRow.get(r); if(!x) continue;
      const inst=clean(x[col.inst]), subj=clean(x[col.subject]);
      if(!inst && !subj) continue;
      if(normName(inst)==='기관' || normName(subj)==='교과') continue;
      const hope=normName(col.hope? x[col.hope] : '');
      if(/교육지원청$|교육청$/.test(hope)) hopeOffice++; else if(hope && hope!=='희망지') hopeSchool++;
      recs.push({inst, rawSubject:subj, name: col.name? clean(x[col.name]) : ''});
    }
    return {sheet:sh.name, recs, guess: hopeOffice>hopeSchool ? '청간' : '관내', hasNameCol:!!col.name};
  }
  throw new Error('명부 형식(「기관」「교과」 머리글)을 찾지 못했습니다.');
}
function rosterKey(r){ return [clean(r.subject),clean(r.reqType),clean(r.reqName)].join('|'); }

function showRosterPreview(out, parsed, fileName, redraw, fixedType){
  const typeSel={value:fixedType};
  const mode=h('select',null,
    h('option',{value:'merge'},'추가 (이미 있는 같은 교과·구분·성명은 건너뜀)'),
    h('option',{value:'replace'},'교체 (명부에 나온 학교의 해당 구분 소요 행을 지우고 새로 넣음)'));
  const area=h('div');
  const draw=()=>{
    const type=typeSel.value;
    const groups=new Map(), unmatched=new Map(), newSubjects=new Set();
    for(const r of parsed.recs){
      const sc=findSchool(r.inst);
      if(!sc){ unmatched.set(r.inst,(unmatched.get(r.inst)||0)+1); continue; }
      const subject=mapSubject(r.rawSubject);
      if(subject && !S.subjects.includes(subject)) newSubjects.add(subject);
      if(!groups.has(sc.id)) groups.set(sc.id,[]);
      groups.get(sc.id).push({subject, reqType:type, reqName:r.name});
    }
    // 학교별로 추가될 행 계산
    const plan=[];
    for(const [id,list] of groups){
      const existing=(S.data[id]?.rows||[]).filter(rowFilled);
      let add=list;
      if(mode.value==='merge'){
        const cnt=new Map(); for(const r of existing){ const k=rosterKey(r); cnt.set(k,(cnt.get(k)||0)+1); }
        add=[]; for(const r of list){ const k=rosterKey(r); const c=cnt.get(k)||0; if(c>0) cnt.set(k,c-1); else add.push(r); }
      }
      const removed = mode.value==='replace' ? existing.filter(r=>clean(r.reqType)===type) : [];
      plan.push({id, list, add, removed});
    }
    plan.sort((a,b)=>S.schools.findIndex(s=>s.id===a.id)-S.schools.findIndex(s=>s.id===b.id));
    const totalAdd=plan.reduce((a,x)=>a+x.add.length,0), totalDel=plan.reduce((a,x)=>a+x.removed.length,0);
    const noName=parsed.recs.filter(r=>!r.name).length;
    const tb=h('tbody', null, plan.map(x=>h('tr',null, h('td',{text:schoolById(x.id).name}), h('td',{text:x.list.length}), h('td',{text:x.add.length}), h('td',{text:x.removed.length||''}))));
    area.replaceChildren(
      h('div',{class:'box'},
        `「${fileName}」 · 명부 ${parsed.recs.length}명 · 학교 ${plan.length}곳 → 추가 ${totalAdd}행`+(totalDel?` · 삭제 ${totalDel}행`:''),
        noName? h('div',{style:'color:var(--warn)',text:`성명이 비어 있는 사람이 ${noName}명입니다. 성명 칸은 비운 채로 넣습니다.`}) : null,
        unmatched.size? h('div',{style:'color:var(--danger)',text:`학교를 찾지 못한 기관(넣지 않음): ${[...unmatched].map(([k,v])=>`${k} ${v}명`).join(', ')} — 설정 → 학교 관리에서 정식명칭을 맞추면 들어갑니다.`}) : null,
        newSubjects.size? h('div',{text:`교과 목록에 없어 새로 추가될 교과: ${[...newSubjects].join(', ')} (설정 → 교과에서 순서 조정 가능)`}) : null),
      h('table',{class:'imp-table'}, h('thead',null,h('tr',null,['학교','명부 인원','추가될 행','삭제될 행'].map(t=>h('th',{text:t})))), tb),
      h('div',{class:'row-btns'}, h('button',{class:'primary',onclick:()=>{
        if(mode.value==='replace' && totalDel && !confirm(`${plan.filter(x=>x.removed.length).length}개 학교에서 소요 구분 「${type}」 행 ${totalDel}개를 지우고 명부로 다시 넣습니다. 그 행에 입력한 발령사항도 함께 지워집니다. 계속할까요?`)) return;
        for(const s of newSubjects) if(!S.subjects.includes(s)) S.subjects.push(s);
        S.rosterInfo={...(S.rosterInfo||{}), [type]:{fileName, savedAt:new Date().toISOString()}};
        S.rosterRecs=S.rosterRecs.filter(r=>r.type!==type).concat(parsed.recs.map(r=>({type, inst:clean(r.inst), subject:mapSubject(r.rawSubject), name:clean(r.name)})));
        for(const x of plan){
          const d=dataOf(x.id);
          if(mode.value==='replace') d.rows=d.rows.filter(r=>!(rowFilled(r) && clean(r.reqType)===type));
          d.rows.push(...x.add.map(r=>({...blankRow(), ...r})));
          d.rows=sortRows(d.rows.filter(rowFilled));
        }
        markChanged(); saveLocal(); toast(`소요사항에 ${totalAdd}행을 넣었습니다.`);
        area.replaceChildren(h('p',{text:`반영 완료: ${totalAdd}행 추가`+(totalDel?`, ${totalDel}행 교체`:'')+'. 설정을 닫으면 화면에 반영됩니다.'}));
      }},'소요사항에 반영')));
  };
  mode.addEventListener('change',draw);
  const warn = parsed.guess!==fixedType ? h('div',{class:'notice',style:'margin-top:10px',text:`주의: 이 파일은 희망지가 ${parsed.guess==='청간'?'교육지원청':'학교'}로 되어 있어 「${parsed.guess} 명부」로 보입니다. 맞는 탭에서 올렸는지 확인하세요.`}) : null;
  out.replaceChildren(warn||'', h('div',{class:'form',style:'margin-top:10px'}, h('label',{text:'반영 방식'}), mode), area);
  draw();
}

/* ---------- 발령사항 전임교 자동 입력 ---------- */
const NO_LOOKUP_TYPES=new Set(['신규','기간제','TO감','TO증','미발령','학교정원']);
function officeNames(){ return S.schools.filter(s=>s.level==='office').map(s=>normName(s.name)).concat([normName(S.labels.org)]); }
function isOurPlace(place){
  const v=normName(place); if(!v) return false;
  if(officeNames().includes(v)) return true;
  return S.schools.some(s=>normName(s.name)===v);
}
// 결과: {status:'ok'|'multi'|'none'|'skip', place, src, places}
function lookupFrom(row){
  const name=normName(row.resName), type=clean(row.resType), subj=clean(row.subject);
  if(!name || !type || NO_LOOKUP_TYPES.has(type)) return {status:'skip'};
  const cands=[];
  if(type==='관내'){
    for(const r of S.rosterRecs) if(r.type==='관내' && normName(r.name)===name) cands.push({place:r.inst, subject:r.subject, src:'관내 명부 소속교'});
    for(const sc of S.schools) for(const x of (S.data[sc.id]?.rows||[])) if(clean(x.reqType)==='관내' && normName(x.reqName)===name) cands.push({place:sc.name, subject:clean(x.subject), src:'소요사항(관내)'});
  } else {
    for(const r of S.pdfRecs) if(normName(r.name)===name && isOurPlace(r.newPlace)) cands.push({place:r.oldPlace, subject:mapSubject(r.subject), src:`발령 PDF 전임지(${r.section})`});
  }
  const pick=(use, note)=>{
    const places=[...new Set(use.map(c=>normName(c.place)))];
    if(places.length===1){ const c=use.find(x=>normName(x.place)===places[0]); return {status:'ok', place:stripProvince(c.place), src:c.src+note}; }
    if(places.length>1) return {status:'multi', places:[...new Set(use.map(c=>stripProvince(c.place)))]};
    return null;
  };
  // 1순위: 성명 + 소요 교과 일치, 2순위: 성명만 일치하고 후보가 한 곳일 때
  return (subj && pick(cands.filter(c=>c.subject===subj),'')) || pick(cands,' · 교과 다름, 성명으로 찾음') || {status:'none'};
}
function autoFillFrom(row){
  const res=lookupFrom(row);
  if(res.status!=='ok') return res;
  if(clean(row.resFrom) && !row.resFromAuto && normName(row.resFrom)!==normName(res.place)) return {...res, status:'kept'}; // 직접 입력한 값은 유지
  const changed = clean(row.resFrom)!==res.place;
  row.resFrom=res.place; row.resFromAuto=res.src;
  return {...res, changed};
}
function fillFromForSchools(ids){
  const out={filled:0, same:0, multi:0, none:0, kept:0};
  for(const id of ids) for(const r of (S.data[id]?.rows||[])){
    if(!rowFilled(r)) continue;
    const res=autoFillFrom(r);
    if(res.status==='ok'){ res.changed? out.filled++ : out.same++; }
    else if(res.status==='multi') out.multi++; else if(res.status==='none') out.none++; else if(res.status==='kept') out.kept++;
  }
  if(out.filled) markChanged();
  return out;
}
function fillMsg(r){ return `전임교 자동 입력 ${r.filled}행`+(r.same?` · 이미 맞음 ${r.same}`:'')+(r.multi?` · 후보 여러 곳 ${r.multi}`:'')+(r.none?` · 찾지 못함 ${r.none}`:'')+(r.kept?` · 직접 입력 유지 ${r.kept}`:''); }
function fromStoreBox(redraw){
  const g=S.rosterRecs.filter(r=>r.type==='관내').length, c=S.rosterRecs.filter(r=>r.type==='청간').length;

function unassignedType(){ return S.stats.unassigned || '미발령'; }

function pdfSubjectSet(){ return new Set((pdfCache?.records||[]).map(x=>mapSubject(x.subject))); }

function stripProvince(v){ return clean(v).replace(/^경기도(?=.+교육지원청$)/,''); }

function buildPdfPlan(opts){
  const recs=pdfCache.records.filter(r=>opts.sections[r.section]?.on);
  const bySchool=new Map(); const nameIdx=new Map(S.schools.map(s=>[normName(s.name),s]));
  for(const r of recs){ const sc=nameIdx.get(normName(r.oldPlace)); if(!sc) continue; if(!bySchool.has(sc.id)) bySchool.set(sc.id,[]); bySchool.get(sc.id).push({...r, subjectM:mapSubject(r.subject), type:opts.sections[r.section].type}); }
  const plan=[];
  for(const sc of S.schools){
    const list=bySchool.get(sc.id)||[];
    const rows=(S.data[sc.id]?.rows||[]).filter(rowFilled);
    const types=new Set(list.map(x=>x.type)); for(const k in opts.sections) if(opts.sections[k].on) types.add(opts.sections[k].type);
    const cand=rows.filter(r=>types.has(clean(r.reqType)));
    if(!list.length && !cand.length) continue;
    const used=new Set(); const matches=[]; const extra=[];
    // 1) 성명이 같은 행
    const pend=[];
    for(const rec of list){
      const row=rec.name && cand.find(r=>!used.has(r) && clean(r.reqType)===rec.type && clean(r.subject)===rec.subjectM && normName(r.reqName)===rec.name);
      if(row){ used.add(row); matches.push({row,rec,by:'name'}); } else pend.push(rec);
    }
    // 2) 성명이 빈 행에 교과 순서대로
    for(const rec of pend){
      const row=cand.find(r=>!used.has(r) && clean(r.reqType)===rec.type && clean(r.subject)===rec.subjectM && !clean(r.reqName));
      if(row){ used.add(row); matches.push({row,rec,by:'subject'}); } else extra.push(rec);
    }
    const left=cand.filter(r=>!used.has(r));
    const changes=matches.filter(m=>{ const nv=opts.strip?stripProvince(m.rec.newPlace):m.rec.newPlace; return clean(m.row.reqTo)!==nv && (opts.overwrite || !clean(m.row.reqTo)); }).length;

/* ---------- 암호화 ---------- */
const ITER=310000; const te=new TextEncoder(), tdc=new TextDecoder();
function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }

async function deriveKey(pass, salt){
  const base=await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}
async function encryptJson(obj, pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pass, salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, te.encode(JSON.stringify(obj))));
  return JSON.stringify({format:'hr-handout-backup-encrypted',v:1,kdf:{name:'PBKDF2',hash:'SHA-256',iterations:ITER},cipher:'AES-GCM-256',salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function decryptJson(env, pass){
  if(!pass) throw new Error('비밀번호를 입력하세요.');
  const key=await deriveKey(pass, unb64(env.salt));
  try{ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)}, key, unb64(env.data)); return JSON.parse(tdc.decode(pt)); }
  catch{ throw new Error('비밀번호가 맞지 않습니다.'); }
}
